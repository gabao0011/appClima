<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura da Grama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        body {
            background-color: #0b0b1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-chart {
            background-color: #141428;
            border: 1px solid #1e1e3a;
            border-radius: 16px;
            padding: 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .card-chart h5 {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .card-chart .subtitle {
            color: #8888aa;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
        }

        .legend-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8888aa;
            font-size: 0.82rem;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-dot.setor-a { background-color: #6c5ce7; }
        .legend-dot.setor-b { background-color: #00cec9; }
        .legend-dot.setor-c { background-color: #55efc4; }
    </style>
</head>
<body>
    <div class="card-chart">
        <h5>Temperatura da Grama</h5>
        <p class="subtitle">Temperatura do solo nos setores (&deg;C)</p>

        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>

        <div class="legend-container">
            <div class="legend-item">
                <span class="legend-dot setor-a"></span>
                Setor A
            </div>
            <div class="legend-item">
                <span class="legend-dot setor-b"></span>
                Setor B
            </div>
            <div class="legend-item">
                <span class="legend-dot setor-c"></span>
                Setor C
            </div>
        </div>
    </div>

    <script>
        const labels = [
            '1:00', '2:00', '3:00', '4:00', '5:00', '6:00', '7:00',
            '8:00', '9:00', '10:00', '11:00', '12:00', '13:00',
            '14:00', '15:00', '16:00', '17:00', '18:00', '19:00',
            '20:00', '21:00', '22:00', '23:00'
        ];

        // Simulated temperature data matching the chart pattern
        // Low temperatures most of the day, spike around 16:00-19:00
        const setorA = [
            1.2, 1.0, 0.8, 0.9, 1.0, 1.1, 1.0,
            1.2, 1.3, 1.1, 1.2, 1.0, 1.1,
            1.5, 2.0, 23.53, 20.5, 15.2, 8.0,
            2.5, 1.8, 1.2, 1.0
        ];

        const setorB = [
            1.5, 1.3, 1.1, 1.2, 1.3, 1.4, 1.3,
            1.5, 1.6, 1.4, 1.5, 1.3, 1.4,
            1.8, 2.5, 25.79, 22.0, 17.5, 10.0,
            3.0, 2.0, 1.5, 1.3
        ];

        const setorC = [
            1.3, 1.1, 0.9, 1.0, 1.1, 1.2, 1.1,
            1.3, 1.4, 1.2, 1.3, 1.1, 1.2,
            1.6, 2.2, 24.91, 28.0, 19.5, 9.0,
            2.8, 1.9, 1.3, 1.1
        ];

        const ctx = document.getElementById('tempChart').getContext('2d');

        const tempChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Setor A',
                        data: setorA,
                        borderColor: '#6c5ce7',
                        backgroundColor: 'rgba(108, 92, 231, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#6c5ce7',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    },
                    {
                        label: 'Setor B',
                        data: setorB,
                        borderColor: '#00cec9',
                        backgroundColor: 'rgba(0, 206, 201, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#00cec9',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    },
                    {
                        label: 'Setor C',
                        data: setorC,
                        borderColor: '#55efc4',
                        backgroundColor: 'rgba(85, 239, 196, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#55efc4',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#1e1e3a',
                        titleColor: '#ffffff',
                        bodyColor: '#ccccdd',
                        borderColor: '#2a2a4a',
                        borderWidth: 1,
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: {
                            size: 14,
                            weight: 'bold'
                        },
                        bodyFont: {
                            size: 12
                        },
                        callbacks: {
                            title: function(items) {
                                return items[0].label;
                            },
                            label: function(context) {
                                return context.dataset.label + ' : ' + context.parsed.y;
                            },
                            labelColor: function(context) {
                                return {
                                    borderColor: context.dataset.borderColor,
                                    backgroundColor: context.dataset.borderColor,
                                    borderWidth: 2,
                                    borderRadius: 2
                                };
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#555577',
                            font: {
                                size: 11
                            },
                            maxRotation: 0,
                            callback: function(val, index) {
                                const label = this.getLabelForValue(val);
                                // Show every 3rd label to avoid crowding
                                if (['1:00','4:00','7:00','10:00','13:00','16:00','19:00','23:00'].includes(label)) {
                                    return label;
                                }
                                return '';
                            }
                        },
                        border: {
                            display: false
                        }
                    },
                    y: {
                        min: 0,
                        max: 28,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#555577',
                            font: {
                                size: 11
                            },
                            stepSize: 7,
                            callback: function(value) {
                                return value;
                            }
                        },
                        border: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '\u00B0C',
                            color: '#555577',
                            font: {
                                size: 12
                            }
                        }
                    }
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
