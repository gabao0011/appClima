<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura da Grama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card bg-dark border-secondary rounded-4 shadow-lg" style="max-width: 540px; width: 100%;">
        <div class="card-body p-4">
            <h5 class="card-title text-white fw-bold">Temperatura da Grama</h5>
            <p class="card-text text-secondary small mb-3">Temperatura do solo nos setores (&deg;C)</p>

            <div class="position-relative" style="height: 280px;">
                <canvas id="tempChart"></canvas>
            </div>

            <div class="d-flex justify-content-center gap-4 mt-3">
                <span class="d-flex align-items-center gap-1 text-secondary small">
                    <span class="badge rounded-circle p-1" style="background-color: #6c5ce7;">&nbsp;</span>
                    Setor A
                </span>
                <span class="d-flex align-items-center gap-1 text-secondary small">
                    <span class="badge rounded-circle p-1" style="background-color: #00cec9;">&nbsp;</span>
                    Setor B
                </span>
                <span class="d-flex align-items-center gap-1 text-secondary small">
                    <span class="badge rounded-circle p-1" style="background-color: #55efc4;">&nbsp;</span>
                    Setor C
                </span>
            </div>
        </div>
    </div>

    <script>
        const labels = [
            '1:00', '2:00', '3:00', '4:00', '5:00', '6:00', '7:00',
            '8:00', '9:00', '10:00', '11:00', '12:00', '13:00',
            '14:00', '15:00', '16:00', '17:00', '18:00', '19:00',
            '20:00', '21:00', '22:00', '23:00'
        ];

        const setorA = [
            1.2, 1.0, 0.8, 0.9, 1.0, 1.1, 1.0,
            1.2, 1.3, 1.1, 1.2, 1.0, 1.1,
            1.5, 2.0, 23.53, 20.5, 15.2, 8.0,
            2.5, 1.8, 1.2, 1.0
        ];

        const setorB = [
            1.5, 1.3, 1.1, 1.2, 1.3, 1.4, 1.3,
            1.5, 1.6, 1.4, 1.5, 1.3, 1.4,
            1.8, 2.5, 25.79, 22.0, 17.5, 10.0,
            3.0, 2.0, 1.5, 1.3
        ];

        const setorC = [
            1.3, 1.1, 0.9, 1.0, 1.1, 1.2, 1.1,
            1.3, 1.4, 1.2, 1.3, 1.1, 1.2,
            1.6, 2.2, 24.91, 28.0, 19.5, 9.0,
            2.8, 1.9, 1.3, 1.1
        ];

        const ctx = document.getElementById('tempChart').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Setor A',
                        data: setorA,
                        borderColor: '#6c5ce7',
                        backgroundColor: 'rgba(108, 92, 231, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#6c5ce7',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    },
                    {
                        label: 'Setor B',
                        data: setorB,
                        borderColor: '#00cec9',
                        backgroundColor: 'rgba(0, 206, 201, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#00cec9',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    },
                    {
                        label: 'Setor C',
                        data: setorC,
                        borderColor: '#55efc4',
                        backgroundColor: 'rgba(85, 239, 196, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#55efc4',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e1e3a',
                        titleColor: '#ffffff',
                        bodyColor: '#ccccdd',
                        borderColor: '#2a2a4a',
                        borderWidth: 1,
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            title: function(items) { return items[0].label; },
                            label: function(context) {
                                return context.dataset.label + ' : ' + context.parsed.y;
                            },
                            labelColor: function(context) {
                                return {
                                    borderColor: context.dataset.borderColor,
                                    backgroundColor: context.dataset.borderColor,
                                    borderWidth: 2,
                                    borderRadius: 2
                                };
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: {
                            color: '#6c757d',
                            font: { size: 11 },
                            maxRotation: 0,
                            callback: function(val) {
                                const label = this.getLabelForValue(val);
                                if (['1:00','4:00','7:00','10:00','13:00','16:00','19:00','23:00'].includes(label)) {
                                    return label;
                                }
                                return '';
                            }
                        },
                        border: { display: false }
                    },
                    y: {
                        min: 0,
                        max: 28,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: {
                            color: '#6c757d',
                            font: { size: 11 },
                            stepSize: 7
                        },
                        border: { display: false },
                        title: {
                            display: true,
                            text: '\u00B0C',
                            color: '#6c757d',
                            font: { size: 12 }
                        }
                    }
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
